[workspace]
resolver = "2"
members = ["crates/lab-proto", "crates/lab-core", "host/labctl"]
# firmware/* are separate cargo projects (esp toolchain, xtensa targets)
exclude = ["firmware"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
postcard = { version = "1", default-features = false }
heapless = { version = "0.8", features = ["serde"] }
serde_json = "1"
