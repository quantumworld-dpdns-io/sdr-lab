name: ci
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -q -p labctl -- validate experiments/*.json
  lab-proto-no-std:
    runs-on: ubuntu-latest
    strategy:
      matrix: { target: [xtensa-esp32s3-none-elf, xtensa-esp32-none-elf] }
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.6
        with: { default: true, buildtargets: esp32s3, ldproxy: false }
      - run: cargo +esp build -p lab-proto --release --target ${{ matrix.target }} -Zbuild-std=core
  # Firmware app builds (tx-s3, rx-s3, controller-esp32 on esp-idf-svc) are added in M1.
