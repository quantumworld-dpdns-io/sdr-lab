[package]
name = "labctl"
version = "0.1.0"
description = "SDR Lab host CLI: validate experiments, talk to the controller, export datasets"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
lab-proto = { path = "../../crates/lab-proto", features = ["std"] }
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }
