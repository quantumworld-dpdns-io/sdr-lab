[package]
name = "labctl"
version = "0.1.0"
description = "SDR Lab host CLI: validate experiments, talk to the controller, export datasets"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
lab-proto = { path = "../../crates/lab-proto", features = ["std"] }
lab-core = { path = "../../crates/lab-core" }
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serialport = { version = "4", default-features = false }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
