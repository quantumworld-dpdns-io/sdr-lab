[package]
name = "tx-s3"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
lab-proto.workspace = true
lab-core.workspace = true
lab-fw = { workspace = true, features = ["radio"] }
esp-idf-svc.workspace = true
log.workspace = true
anyhow.workspace = true

[build-dependencies]
embuild.workspace = true

[features]
default = []
# Mac-as-controller mode (`labctl hub`), linked over the devkit's UART/COM
# USB connector (UART0 via the CH340/CP210x bridge).
host-link = []
# Same, but over the native "USB" connector (USB-Serial-JTAG).
host-link-usb = ["lab-fw/usb-jtag"]
